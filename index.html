<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RW - Material OCR Batch System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เพิ่มไลบรารี Panzoom สำหรับจัดการระบบสัมผัสและใช้นิ้วซูมบนมือถือ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/panzoom/9.4.0/panzoom.min.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        [contenteditable="true"]:hover { background-color: rgba(255,255,255,0.8); cursor: text; border-radius: 4px; box-shadow: 0 0 0 1px #cbd5e1; }
        [contenteditable="true"]:focus { outline: 2px solid #3b82f6; background-color: #fff; border-radius: 4px; padding: 0 4px; }
        .thumbnail-img { object-fit: cover; width: 100%; height: 100%; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้สำหรับโหมดปกติ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .zoom-overlay { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col items-center py-8 px-4">
    
    <!-- 🛑 นำ URL Web App อันใหม่ ของคุณมาใส่ที่นี่ 🛑 -->
    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwwMZdpQs3FFASa54nkro0PyawvVrRvouSi9aezI96N-jKX8S5QrO9DAKQ2Xxy5du7LXA/exec"; 
    </script>

    <div class="w-full max-w-md mb-4">
        <h2 class="text-gray-500 font-bold text-sm mb-1">🛠️ โหมดการพัฒนา (Batch Process Mode)</h2>
        <p class="text-xs text-gray-400">อัปโหลดได้หลายรูป สกัดอัตโนมัติเบื้องหลัง ลองใหม่ได้ 3 ครั้ง</p>
    </div>

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl border-t-4 border-yellow-500 overflow-hidden flex flex-col h-[80vh] min-h-[500px]">
        
        <div class="p-5 pb-3 border-b flex justify-between items-center bg-white z-10">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">📸 รับเข้าวัตถุดิบ</h1>
            <span id="queue-counter" class="text-xs bg-gray-100 px-3 py-1.5 rounded-full text-gray-600 font-bold">0 รูป</span>
        </div>

        <!-- พื้นที่หลัก (เลื่อนได้) -->
        <div id="main-content" class="flex-1 overflow-y-auto p-5 bg-gray-50 no-scrollbar">
            
            <!-- โหมดที่ 1: หน้าจอเลือกรูปภาพ -->
            <div id="upload-mode" class="flex flex-col h-full animate-fade-in">
                <!-- พื้นที่แสดงรูปที่เลือก (Grid) -->
                <div id="thumbnails-grid" class="grid grid-cols-3 gap-3 mb-6 auto-rows-[100px] empty:hidden">
                    <!-- Javascript จะเติมรูปที่นี่ -->
                </div>

                <!-- พื้นที่ว่างเมื่อยังไม่มีรูป -->
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl bg-white mb-6">
                    <span class="text-6xl mb-4 opacity-50">📷</span>
                    <p class="text-gray-400 text-sm text-center px-4 font-medium">ยังไม่มีรูปภาพ<br>สามารถเลือกไฟล์พร้อมกันได้หลายรูป</p>
                </div>

                <!-- ปุ่มเพิ่มรูปภาพ (ติดอยู่ล่างสุดของโหมดเลือกรูป) -->
                <div class="flex gap-3 w-full mt-auto">
                    <label class="flex-1 bg-white border-2 border-gray-300 text-gray-700 font-bold py-3 px-2 rounded-xl text-center cursor-pointer hover:bg-gray-50 active:bg-gray-100 transition-all shadow-sm flex flex-col items-center justify-center text-sm">
                        <span class="text-2xl mb-1">📁</span> เลือกไฟล์รูป
                        <input type="file" multiple accept="image/*" class="hidden" onchange="handleFiles(event)">
                    </label>
                    <label class="flex-1 bg-yellow-500 border-2 border-yellow-500 text-white font-bold py-3 px-2 rounded-xl text-center cursor-pointer hover:bg-yellow-600 transition-all shadow-sm flex flex-col items-center justify-center text-sm">
                        <span class="text-2xl mb-1">📸</span> ถ่ายรูปใหม่
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleFiles(event)">
                    </label>
                </div>
            </div>

            <!-- โหมดที่ 2: หน้าจอแสดงผลลัพธ์ (Cards) -->
            <div id="result-mode" class="hidden flex-col space-y-4 animate-fade-in pb-20">
                <!-- Javascript จะเติม Card ผลลัพธ์ที่นี่ -->
            </div>

        </div>

        <!-- ปุ่ม Action หลัก (อยู่ด้านล่างเสมอ) -->
        <div class="p-4 bg-white border-t">
            <!-- ปุ่มสั่งแสดงผลสกัด (โหมด 1) -->
            <button id="btn-extract" disabled class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" onclick="switchToResultMode()">
                <span class="text-xl">🤖</span> <span id="btn-extract-text">กรุณาเลือกรูปภาพก่อน</span>
            </button>
            
            <!-- ปุ่มบันทึกทั้งหมด (โหมด 2) -->
            <button id="btn-save-all" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all hidden flex items-center justify-center gap-2" onclick="saveAllToSheet()">
                <span class="text-xl">💾</span> บันทึกรับเข้าสต็อกทั้งหมด
            </button>
            
            <button id="btn-back" class="w-full bg-gray-100 text-gray-600 font-bold py-2 mt-2 rounded-xl hidden hover:bg-gray-200" onclick="switchToUploadMode()">
                กลับไปเลือกรูปเพิ่ม
            </button>
        </div>

    </main>

    <!-- Canvas สำหรับย่อรูป -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        // โครงสร้างข้อมูลคิวรูปภาพ
        let imageQueue = [];
        let isResultMode = false;
        const MAX_CONCURRENT = 3; 
        const MAX_RETRIES = 3;    

        // 🌟 เพิ่ม Object สำหรับเก็บสถานะ Panzoom
        const panzoomInstances = {};

        // 1. จัดการเมื่อผู้ใช้เลือกไฟล์
        function handleFiles(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            document.getElementById('empty-state').classList.add('hidden');
            
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => resizeAndQueueImage(e.target.result);
                reader.readAsDataURL(file);
            });

            event.target.value = '';
        }

        // 2. ย่อขนาดรูปผ่าน Canvas และเข้าคิว
        function resizeAndQueueImage(dataUrl) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_SIZE = 1200;
                let width = img.width;
                let height = img.height;

                if (width > height && width > MAX_SIZE) {
                    height *= MAX_SIZE / width; width = MAX_SIZE;
                } else if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height; height = MAX_SIZE;
                }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.8);
                const uniqueId = 'img_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                
                imageQueue.push({
                    id: uniqueId,
                    base64: base64,
                    status: 'pending',
                    retries: 0,
                    data: null
                });

                updateUploadUI();
                processQueue();
            }
            img.src = dataUrl;
        }

        // 3. ระบบจัดการคิว (ทำงานเบื้องหลัง)
        async function processQueue() {
            const processingItems = imageQueue.filter(item => item.status === 'processing');
            if (processingItems.length >= MAX_CONCURRENT) return; 

            const availableSlots = MAX_CONCURRENT - processingItems.length;
            const pendingItems = imageQueue.filter(item => item.status === 'pending').slice(0, availableSlots);
            
            if (pendingItems.length === 0) return;

            pendingItems.forEach(item => item.status = 'processing');
            if (isResultMode) renderResultCards();

            try {
                const payloadImages = pendingItems.map(item => ({
                    id: item.id,
                    image: item.base64.split(',')[1],
                    mimeType: item.base64.split(';')[0].split(':')[1]
                }));

                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'batch_ocr', images: payloadImages })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    result.results.forEach(res => {
                        const item = imageQueue.find(i => i.id === res.id);
                        if (item) {
                            if (res.status === 'success') {
                                item.status = 'success';
                                item.data = res.data;
                            } else {
                                handleItemFailure(item);
                            }
                        }
                    });
                } else {
                    pendingItems.forEach(item => handleItemFailure(item));
                }
            } catch (error) {
                pendingItems.forEach(item => handleItemFailure(item));
            }

            if (isResultMode) renderResultCards();
            processQueue();
        }

        // 4. จัดการเมื่อส่งพลาด
        function handleItemFailure(item) {
            item.retries++;
            if (item.retries >= MAX_RETRIES) {
                item.status = 'error';
            } else {
                item.status = 'pending';
            }
        }

        // 5. อัปเดต UI หน้าแรก
        function updateUploadUI() {
            document.getElementById('queue-counter').innerText = `${imageQueue.length} รูป`;
            
            const grid = document.getElementById('thumbnails-grid');
            grid.innerHTML = ''; 
            
            imageQueue.forEach(item => {
                const div = document.createElement('div');
                div.className = 'relative rounded-xl overflow-hidden shadow-sm border border-gray-200 bg-gray-200';
                div.innerHTML = `<img src="${item.base64}" class="thumbnail-img">`;
                grid.appendChild(div);
            });

            const btnExtract = document.getElementById('btn-extract');
            if (imageQueue.length > 0) {
                btnExtract.disabled = false;
                btnExtract.innerHTML = `<span class="text-xl">🤖</span> สกัดข้อมูล (${imageQueue.length} รายการ)`;
                btnExtract.classList.replace('bg-gray-800', 'bg-blue-600');
            }
        }

        // 6. เปลี่ยนโหมด UI
        function switchToResultMode() {
            if (imageQueue.length === 0) return;
            isResultMode = true;
            document.getElementById('upload-mode').classList.add('hidden');
            document.getElementById('result-mode').classList.remove('hidden');
            
            document.getElementById('btn-extract').classList.add('hidden');
            document.getElementById('btn-save-all').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            
            renderResultCards();
        }

        function switchToUploadMode() {
            isResultMode = false;
            document.getElementById('upload-mode').classList.remove('hidden');
            document.getElementById('result-mode').classList.add('hidden');
            
            document.getElementById('btn-extract').classList.remove('hidden');
            document.getElementById('btn-save-all').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
        }

        // 🌟 อัปเกรดฟังก์ชันเปิด/ปิดรูปขยาย พร้อมใช้งาน Panzoom
        window.togglePreviewImage = function(id) {
            const previewContainer = document.getElementById('preview_' + id);
            if (previewContainer) {
                previewContainer.classList.toggle('hidden');
                
                const imgElement = document.getElementById('img_zoom_' + id);

                if (!previewContainer.classList.contains('hidden')) {
                    // สร้าง Panzoom เมื่อรูปถูกเปิด (ถ้ายังไม่มี)
                    if (!panzoomInstances[id] && typeof panzoom !== 'undefined') {
                        panzoomInstances[id] = panzoom(imgElement, {
                            maxZoom: 5,
                            minZoom: 1,
                            bounds: true,
                            boundsPadding: 0
                        });
                    }
                } else {
                    // รีเซ็ตตำแหน่งเวลาปิดรูป
                    if (panzoomInstances[id]) {
                        panzoomInstances[id].smoothZoomAbs(0, 0, 1);
                        panzoomInstances[id].moveTo(0, 0);
                    }
                }
            }
        }

        // 🌟 อัปเกรดฟังก์ชันซูมโดยใช้ปุ่ม (ทำงานร่วมกับ Panzoom)
        window.toggleZoomById = function(id) {
            if (panzoomInstances[id]) {
                const transform = panzoomInstances[id].getTransform();
                if (transform.scale > 1.2) {
                    // หากซูมอยู่ ให้ย่อกลับ 100%
                    panzoomInstances[id].smoothZoomAbs(0, 0, 1);
                    panzoomInstances[id].moveTo(0, 0);
                } else {
                    // หากไม่ได้ซูม ให้ซูมเข้าตรงกลางรูปภาพที่ 2.5 เท่า
                    const img = document.getElementById('img_zoom_' + id);
                    const rect = img.getBoundingClientRect();
                    panzoomInstances[id].smoothZoomAbs(rect.width / 2, rect.height / 2, 2.5);
                }
            }
        }

        // 7. วาด Card ผลลัพธ์
        function renderResultCards() {
            const container = document.getElementById('result-mode');
            container.innerHTML = '';
            
            let isWorking = false;

            imageQueue.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col relative';
                
                let html = `
                    <div class="flex gap-3 mb-3 items-center border-b pb-3">
                        <div class="relative cursor-pointer group rounded overflow-hidden w-12 h-12 border shadow-sm" onclick="togglePreviewImage('${item.id}')" title="แตะเพื่อขยายรูปตรวจสอบ">
                            <img src="${item.base64}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center zoom-overlay">
                                <span class="text-white text-lg">🔍</span>
                            </div>
                        </div>
                        <div class="flex-1 font-bold text-gray-700">รูปภาพที่ ${index + 1}</div>
                `;

                if (item.status === 'pending' || item.status === 'processing') {
                    isWorking = true;
                    html += `
                        <div class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-full flex items-center gap-1">
                            <svg class="animate-spin h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            กำลังสกัดข้อความ...
                        </div></div>
                        <div class="text-center py-4 text-gray-400 text-sm">รอสักครู่ ระบบกำลังอ่านข้อมูลด้วย AI</div>
                    `;
                } 
                else if (item.status === 'success') {
                    html += `
                        <div class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full">✓ สำเร็จ</div>
                        <button class="text-red-400 hover:text-red-600 text-xl font-bold px-2" onclick="removeItem('${item.id}')">&times;</button>
                        </div>
                        
                        <!-- 🌟 พื้นที่รูปภาพขยาย พร้อมระบบซูมอิสระ (Panzoom) -->
                        <div id="preview_${item.id}" class="hidden mb-4 rounded-lg overflow-hidden border border-gray-300 relative bg-gray-900 animate-fade-in shadow-inner">
                            <div class="flex justify-between items-center bg-gray-800 text-white px-3 py-1.5 text-xs sticky top-0 z-10 shadow-md">
                                <span class="font-bold flex items-center gap-1">👁️ เทียบข้อมูลต้นฉบับ</span>
                                <div class="flex gap-2">
                                    <button onclick="toggleZoomById('${item.id}')" class="text-blue-200 hover:text-white px-2 py-1 rounded bg-blue-900 border border-blue-700 flex items-center gap-1"><span class="text-[10px]">🔍</span> ซูม 2.5x</button>
                                    <button onclick="togglePreviewImage('${item.id}')" class="text-gray-300 hover:text-white px-2 py-1 rounded bg-gray-700 border border-gray-600">ซ่อน ✕</button>
                                </div>
                            </div>
                            <!-- โซนสำหรับรูปภาพ ตัด overflow ออกเพื่อให้เลื่อนอิสระ -->
                            <div class="w-full bg-black text-center h-[300px] overflow-hidden relative touch-none">
                                <img id="img_zoom_${item.id}" src="${item.base64}" class="w-full h-full object-contain cursor-move pointer-events-auto">
                                <!-- คำแนะนำ -->
                                <div class="absolute bottom-2 left-0 right-0 pointer-events-none flex justify-center">
                                    <span class="bg-black bg-opacity-70 text-white text-[10px] px-3 py-1.5 rounded-full flex items-center gap-2">
                                        <span>👆 ใช้นิ้วกางเพื่อซูม</span> <span>🖐️ ลากเพื่อเลื่อน</span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- ฟอร์มข้อมูล -->
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                                <span class="text-[10px] text-blue-500 block font-bold">PART NO.</span>
                                <div id="part_${item.id}" class="text-gray-800 font-bold" contenteditable="true">${item.data.part || '-'}</div>
                            </div>
                            <div class="bg-indigo-50 p-2 rounded-lg border border-indigo-100">
                                <span class="text-[10px] text-indigo-500 block font-bold">LOT NO.</span>
                                <div id="lot_${item.id}" class="text-gray-800 font-bold" contenteditable="true">${item.data.lot || '-'}</div>
                            </div>
                            <div class="bg-green-50 p-2 rounded-lg border border-green-100">
                                <span class="text-[10px] text-green-500 block font-bold">WEIGHT</span>
                                <div id="weight_${item.id}" class="text-gray-800 font-bold" contenteditable="true">${item.data.weight || '-'}</div>
                            </div>
                            <div class="bg-purple-50 p-2 rounded-lg border border-purple-100">
                                <span class="text-[10px] text-purple-500 block font-bold">REEL NO.</span>
                                <div id="reel_${item.id}" class="text-gray-800 font-bold" contenteditable="true">${item.data.reel || '-'}</div>
                            </div>
                        </div>
                        <div class="text-[10px] text-gray-400 text-center mt-3 flex items-center justify-center gap-1">
                            <span>💡 แตะตัวเลขเพื่อแก้ไข</span> หรือ <button class="text-blue-500 underline font-bold" onclick="togglePreviewImage('${item.id}')">ดู/ซูมรูปเทียบข้อมูล</button>
                        </div>
                    `;
                } 
                else if (item.status === 'error' || item.status === 'duplicate') {
                    const isDup = item.status === 'duplicate';
                    const badgeText = isDup ? '✗ ข้อมูลซ้ำ' : '✗ ล้มเหลว';
                    const errorMsg = isDup ? 'รูปซ้ำ! ข้อมูลนี้มีในสต็อกแล้ว' : 'ไม่สามารถอ่านรูปนี้ได้ (ลอง 3 ครั้งแล้ว)';
                    const actionBtn = isDup ? '' : `<button class="px-4 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm font-bold hover:bg-gray-300" onclick="manualRetry('${item.id}')">ลองใหม่</button>`;

                    html += `
                        <div class="text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded-full">${badgeText}</div>
                        <button class="text-red-400 hover:text-red-600 text-xl font-bold px-2" onclick="removeItem('${item.id}')">&times;</button>
                        </div>
                        <div class="text-center py-4 flex flex-col items-center">
                            <span class="text-red-500 text-sm mb-2 font-bold">${errorMsg}</span>
                            ${actionBtn}
                        </div>
                    `;
                }
                card.innerHTML = html;
                container.appendChild(card);
            });

            const btnSave = document.getElementById('btn-save-all');
            if (isWorking) {
                btnSave.disabled = true;
                btnSave.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กรุณารอระบบอ่านข้อมูลให้ครบ...`;
                btnSave.classList.add('opacity-70');
            } else {
                btnSave.disabled = false;
                btnSave.innerHTML = `<span class="text-xl">💾</span> บันทึกรับเข้าสต็อกทั้งหมด`;
                btnSave.classList.remove('opacity-70');
            }
        }

        // 8. ให้ผู้ใช้สั่งลองใหม่เอง
        function manualRetry(id) {
            const item = imageQueue.find(i => i.id === id);
            if (item) {
                item.status = 'pending';
                item.retries = 0;
                renderResultCards();
                processQueue();
            }
        }

        // ลบรูปที่ไม่ต้องการ พร้อมคืนหน่วยความจำ (Panzoom)
        function removeItem(id) {
            imageQueue = imageQueue.filter(i => i.id !== id);
            if (panzoomInstances[id]) {
                panzoomInstances[id].dispose();
                delete panzoomInstances[id];
            }
            updateUploadUI();
            if (imageQueue.length === 0) switchToUploadMode();
            else renderResultCards();
        }

        // 9. บันทึกข้อมูล
        async function saveAllToSheet() {
            const validItems = imageQueue.filter(i => i.status === 'success');
            if (validItems.length === 0) return alert("ไม่มีข้อมูลที่สมบูรณ์ให้บันทึก");

            const btnSave = document.getElementById('btn-save-all');
            btnSave.disabled = true;
            btnSave.innerHTML = "กำลังบันทึก...";

            const payloadDataArray = validItems.map(item => {
                return {
                    id: item.id,
                    data: {
                        part: document.getElementById('part_' + item.id).innerText.trim(),
                        lot: document.getElementById('lot_' + item.id).innerText.trim(),
                        weight: document.getElementById('weight_' + item.id).innerText.trim(),
                        reel: document.getElementById('reel_' + item.id).innerText.trim()
                    }
                };
            });

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'batch_save', dataArray: payloadDataArray })
                });

                const result = await response.json();
                
                if (result.status === 'success' || result.status === 'partial') {
                    alert('✅ ' + result.message);
                    
                    const successIds = result.successIds || [];
                    const duplicateItems = result.duplicateItems || [];
                    
                    imageQueue = imageQueue.filter(item => {
                        const isSuccess = successIds.includes(item.id);
                        if (isSuccess) {
                            if (panzoomInstances[item.id]) {
                                panzoomInstances[item.id].dispose();
                                delete panzoomInstances[item.id];
                            }
                            return false; 
                        }
                        
                        const dupInfo = duplicateItems.find(d => d.id === item.id);
                        if (dupInfo) {
                            item.status = 'duplicate';
                            alert(`พบรายการซ้ำ: รูปที่ ${imageQueue.indexOf(item)+1} กรุณาแก้ไขข้อมูลหรือลบทิ้ง`);
                        }
                        return true;
                    });

                    updateUploadUI();
                    if (imageQueue.length === 0) switchToUploadMode();
                    else renderResultCards();

                } else {
                    alert("บันทึกไม่สำเร็จ: " + result.message);
                }
            } catch (error) {
                alert("ไม่สามารถเชื่อมต่อเพื่อบันทึกได้: " + error.message);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = `<span class="text-xl">💾</span> บันทึกรับเข้าสต็อกทั้งหมด`;
            }
        }
    </script>
</body>
